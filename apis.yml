name: Command E
description: >-
  Command E was a universal search startup that built a keyboard-driven (Cmd+E)
  desktop tool for searching across the cloud applications people use at work —
  Google Drive, Slack, Notion, email, and more — from a single command bar,
  returning unified results without switching apps. The company was backed by
  Amplify Partners in the ai-ml / productivity search space. Command E was
  acquired by Dropbox in 2021, and its team went on to help build Dropbox Dash.
  Its former developer/marketing site at getcommande.com no longer resolves, so
  no live API, OpenAPI, or developer documentation surface is available to
  enrich; this profile is retained as a historical portfolio-company record.
